services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: love_ai
    ports:
      - "5432:5432"
    volumes:
      - love_ai_pgdata:/var/lib/postgresql/data
volumes:
  love_ai_pgdata:
